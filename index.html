<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <title>Private Wedding Invitation | Austin &amp; Jia Jia</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500&family=Poppins:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --gold: #d4af37;
      --gold-light: #e8cf83;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      color: #51443e;
    }

    /* =========================================
       PRIVATE WEDDING INVITATION GATE
    ========================================= */

    .access-gate {
      position: fixed;
      inset: 0;
      z-index: 1000000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
      overflow-y: auto;

      background:
        linear-gradient(
          rgba(255, 248, 249, 0.72),
          rgba(255, 248, 249, 0.82)
        ),
        url("assets/images/bgimg.webp") center / cover no-repeat;
    }

    .access-card {
      width: 100%;
      max-width: 430px;
      padding: 38px 30px;
      text-align: center;

      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(212, 175, 55, 0.55);
      box-shadow: 0 15px 50px rgba(70, 45, 45, 0.12);
    }

    .access-heart {
      font-family: "Great Vibes", cursive;
      color: var(--gold);
      font-size: 46px;
      line-height: 1;
      margin: 0 0 20px;
    }

    .access-eyebrow {
      color: #9b7b65;
      font-size: 10px;
      letter-spacing: 3px;
      margin: 0 0 12px;
    }

    .access-card h1 {
      font-family: "Playfair Display", serif;
      color: var(--gold);
      font-size: clamp(30px, 7vw, 40px);
      font-weight: 400;
      margin: 0 0 18px;
    }

    .access-divider {
      width: 75px;
      height: 1px;
      margin: 0 auto 22px;
      background: var(--gold);
    }

    .access-message {
      max-width: 310px;
      margin: 0 auto 24px;
      color: #6b625e;
      font-size: 13px;
      line-height: 1.9;
    }

    .access-label {
      display: block;
      margin-bottom: 10px;
      color: #8b7669;
      font-size: 11px;
      letter-spacing: 1px;
    }

    #accessCode {
      display: block;
      width: 100%;
      padding: 14px 12px;

      border: 1px solid #e3d4cc;
      border-radius: 0;

      background: #fffdfd;
      color: #51443e;

      font-family: inherit;
      font-size: 14px;
      text-align: center;
      letter-spacing: 1px;

      outline: none;
    }

    #accessCode:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
    }

    .access-button {
      width: 100%;
      margin-top: 14px;
      padding: 15px 12px;

      border: none;
      border-radius: 0;

      background: linear-gradient(
        135deg,
        var(--gold),
        var(--gold-light)
      );

      color: white;
      font-family: "Poppins", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;

      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .access-button:hover {
      filter: brightness(1.04);
    }

    .access-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #message {
      min-height: 18px;
      margin: 12px 0 0;

      color: #a33e48;
      font-size: 12px;
      line-height: 1.5;
    }

    .access-date {
      margin: 26px 0 0;
      color: #9b7b65;
      font-size: 9px;
      letter-spacing: 2px;
    }

    /* Mobile layout */

    @media (max-width: 480px) {
      .access-gate {
        padding: 20px;
      }

      .access-card {
        padding: 32px 22px;
      }
    }

    /* Short screens: allow scrolling if necessary */

    @media (max-height: 560px) {
      .access-gate {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       PRIVATE INVITATION GATE
  ========================================== -->

  <main id="accessGate" class="access-gate">
    <div class="access-card">

      <p class="access-heart">♡</p>

      <p class="access-eyebrow">
        A PRIVATE INVITATION
      </p>

      <h1>Austin &amp; Jia Jia</h1>

      <div class="access-divider"></div>

      <p class="access-message">
        This invitation is reserved for our family
        and friends. Please enter the access code
        to continue.
      </p>

      <form id="loginForm">

        <label for="accessCode" class="access-label">
          Invitation access code
        </label>

        <input
          id="accessCode"
          name="code"
          type="password"
          inputmode="text"
          autocomplete="off"
          maxlength="128"
          placeholder="Enter access code"
          required
        >

        <button
          id="submitButton"
          type="submit"
          class="access-button"
        >
          OPEN INVITATION
        </button>

        <p
          id="message"
          role="alert"
          aria-live="polite"
        ></p>

      </form>

      <p class="access-date">
        13 DECEMBER 2026 · MEDAN
      </p>

    </div>
  </main>

  <!-- =========================================
       LOGIN AND SESSION HANDLING
  ========================================== -->

  <script>
    const form = document.getElementById("loginForm");
    const input = document.getElementById("accessCode");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    /*
     * Check whether the visitor already has
     * a valid authenticated session.
     */
    async function checkExistingSession() {
      try {
        const response = await fetch("/api/me", {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store"
        });

        if (!response.ok) {
          return;
        }

        const result = await response.json();

        if (result.inviteId) {
          const destination = new URL(
            "/invitation.html",
            window.location.origin
          );

          destination.searchParams.set(
            "invite",
            result.inviteId
          );

          window.location.replace(
            destination.pathname + destination.search
          );
        }

      } catch {
        // If session checking fails, the visitor
        // can still enter their access code.
      }
    }

    /*
     * Verify the invitation access code.
     */
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const code = input.value.trim();

      if (!code) {
        message.textContent =
          "Please enter your access code.";
        return;
      }

      button.disabled = true;
      button.textContent = "VERIFYING...";
      message.textContent = "";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            code: code
          })
        });

        const result = await response.json();

        if (!response.ok) {
          message.textContent =
            result.error ||
            "Unable to verify your code.";

          input.value = "";
          input.focus();

          return;
        }

        /*
         * Keep the successful-login redirect
         * consistent with your existing login flow.
         */
        window.location.replace("/invitation.html");

      } catch {
        message.textContent =
          "Unable to connect. Please try again.";

      } finally {
        button.disabled = false;
        button.textContent = "OPEN INVITATION";
      }
    });

    /*
     * Run session check when the page loads.
     */
    checkExistingSession();
  </script>

</body>
</html>
